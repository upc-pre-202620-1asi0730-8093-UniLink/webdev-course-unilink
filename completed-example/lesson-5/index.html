<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Perfil Personal</title>
    <!-- Enlace a la hoja de estilos CSS -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

<!-- Contenedor principal que agrupa toda la tarjeta -->
<div class="tarjeta-perfil">

    <!-- Imagen de perfil con avatar y texto alternativo -->
    <img src="https://api.dicebear.com/7.x/avataaars/svg?seed=Estudiante" alt="Avatar de perfil">

    <!-- Título principal con el nombre -->
    <h1>¡Hola, soy Alex!</h1>

    <!-- Párrafo descriptivo -->
    <p>Estudiante de secundaria apasionado por la tecnología, los videojuegos y el desarrollo web.</p>

    <!-- Lista de pasatiempos e intereses -->
    <ul>
        <li>🎮 Videojuegos</li>
        <li>🎵 Música</li>
        <li>💻 Programación</li>
    </ul>

    <!-- Enlace estilizado como botón interactivo -->
    <a href="https://codepen.io" target="_blank">Visitar mi perfil</a>

</div>

</body>
</html>
